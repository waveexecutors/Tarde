name: Build Alex Friend Mod

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Verify Java version
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"

      - name: Show repository contents
        run: |
          echo "=== Repository root ==="
          ls -la

      - name: Extract source ZIP
        run: |
          if [ -f "alexfriend-src.zip" ]; then
            echo "Extracting alexfriend-src.zip ..."
            unzip -o alexfriend-src.zip
            echo "=== After extraction ==="
            ls -la
          else
            echo "No alexfriend-src.zip found in root."
            echo "Make sure the ZIP is committed to the repository root."
            exit 1
          fi

      - name: Verify required files
        run: |
          if [ ! -f "build.gradle" ]; then
            echo "ERROR: build.gradle missing"
            find . -name "build.gradle" || true
            exit 1
          fi
          if [ ! -f "gradlew" ]; then
            echo "ERROR: gradlew missing"
            exit 1
          fi
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "ERROR: gradle-wrapper.jar missing"
            exit 1
          fi
          echo "All required files present."
          chmod +x gradlew
          ls -l gradlew build.gradle gradle/wrapper/

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle4.9-${{ hashFiles('**/build.gradle') }}
          restore-keys: |
            ${{ runner.os }}-gradle4.9-

      - name: Build with Gradle 4.9 (via wrapper)
        run: |
          echo "=== Building with Java 8 + Gradle 4.9 wrapper ==="
          java -version
          ./gradlew --version || true
          # First try setup (may take time / fail on some runners, we continue)
          ./gradlew --no-daemon setupDecompWorkspace --stacktrace || echo "setupDecompWorkspace finished with warnings"
          # Main build
          ./gradlew --no-daemon build --stacktrace

      - name: Collect JAR
        run: |
          mkdir -p artifacts
          find . -path "*/build/libs/*.jar" -exec cp -v {} artifacts/ \; || true
          echo "=== Built artifacts ==="
          ls -la artifacts/ || true

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: alexfriend-mod
          path: artifacts/*.jar
          if-no-files-found: warn
