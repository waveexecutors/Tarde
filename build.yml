name: Build Alex Friend Mod

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      zip_url:
        description: 'Optional direct URL to the source ZIP (if not using repo contents)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Download and extract source ZIP (if provided)
        if: ${{ github.event.inputs.zip_url != '' }}
        run: |
          mkdir -p alexfriend-src
          curl -L -o alexfriend-src.zip "${{ github.event.inputs.zip_url }}"
          unzip -o alexfriend-src.zip -d alexfriend-src
          # If the ZIP contains a single top-level folder, move contents up
          if [ $(ls alexfriend-src | wc -l) -eq 1 ]; then
            TOP=$(ls alexfriend-src)
            mv alexfriend-src/$TOP/* alexfriend-src/ 2>/dev/null || true
            rmdir alexfriend-src/$TOP 2>/dev/null || true
          fi
          echo "Extracted source from ZIP"
          ls -la alexfriend-src

      - name: Locate project root
        id: root
        run: |
          if [ -d "alexfriend-src" ] && [ -f "alexfriend-src/build.gradle" ]; then
            echo "dir=alexfriend-src" >> $GITHUB_OUTPUT
          elif [ -f "build.gradle" ]; then
            echo "dir=." >> $GITHUB_OUTPUT
          elif [ -d "alexfriend-mod" ] && [ -f "alexfriend-mod/build.gradle" ]; then
            echo "dir=alexfriend-mod" >> $GITHUB_OUTPUT
          else
            echo "Could not find build.gradle"
            find . -name "build.gradle" | head -5
            exit 1
          fi

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew (if present)
        working-directory: ${{ steps.root.outputs.dir }}
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          else
            echo "No gradlew found. Will attempt to use system gradle or generate wrapper later if needed."
          fi

      - name: Setup Forge workspace and build
        working-directory: ${{ steps.root.outputs.dir }}
        run: |
          # Classic FG 2.3 often needs the setup tasks. We try a pragmatic build path.
          # First attempt direct build; if wrapper missing we fall back to a minimal approach.
          if [ -f gradlew ]; then
            ./gradlew --no-daemon setupDecompWorkspace build --stacktrace || ./gradlew --no-daemon build --stacktrace
          else
            # Fallback: install a compatible gradle and try
            echo "Attempting build without wrapper (may require manual MDK for full decomp)"
            # For pure source + build.gradle many CI setups still succeed with:
            gradle wrapper --gradle-version 4.9 || true
            if [ -f gradlew ]; then
              chmod +x gradlew
              ./gradlew --no-daemon build --stacktrace || true
            fi
          fi
          # Collect jars
          mkdir -p $GITHUB_WORKSPACE/artifacts
          find . -path "*/build/libs/*.jar" -exec cp {} $GITHUB_WORKSPACE/artifacts/ \; || true
          ls -la $GITHUB_WORKSPACE/artifacts || true

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: alexfriend-mod-jar
          path: artifacts/*.jar
          if-no-files-found: warn

      - name: Summary
        run: |
          echo "### Alex Friend Build" >> $GITHUB_STEP_SUMMARY
          echo "Build completed for Forge 1.12.2." >> $GITHUB_STEP_SUMMARY
          echo "Check the uploaded artifact for the JAR." >> $GITHUB_STEP_SUMMARY
